name: CI

# Fluxo: branch nova -> PR (este CI valida) -> revisão/aprovação -> merge na main ->
# este CI roda de novo na main e, passando, publica em produção (job deploy).
# Não há ambiente de homologação: a validação é o CI do PR + a revisão.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um CI por PR/branch: um push novo cancela o anterior. Na main nunca cancela (deploy em curso).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Padrão de nome: tipo/NN-descricao-curta (ex.: feat/12-dashboard-visao-geral).
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir nome da branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          padrao='^(feat|fix|chore|docs|refactor|test|ci|hotfix)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if ! printf '%s' "$BRANCH" | grep -Eq "$padrao"; then
            echo "::error::Nome de branch inválido: '$BRANCH'. Use tipo/NN-descricao-curta, ex.: feat/12-dashboard-visao-geral (tipos: feat fix chore docs refactor test ci hotfix)."
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest

    # Banco de verdade para os testes que não são mockados (o schema vem das migrations do projeto).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ethos
          POSTGRES_PASSWORD: ethos_secret
          POSTGRES_DB: ethos_financial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ethos -d ethos_financial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ethos:ethos_secret@localhost:5432/ethos_financial

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Run API tests
        run: npm run test:api

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build Web
        run: npm run build --workspace=apps/web -- --configuration production
        env:
          NG_CLI_ANALYTICS: "false"

  # Só no push na main (merge do PR aprovado) e só depois do CI passar.
  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
