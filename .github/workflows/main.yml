name: CI

# lint + testes em todo push/PR; o deploy só roda depois que eles passam, em push na main.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Ainda há arquivos antigos fora do padrão do Prettier (rode `npm run format` para
      # corrigir tudo de uma vez); enquanto isso o aviso não bloqueia o deploy.
      - name: Format check
        run: npm run format:check
        continue-on-error: true

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run API tests
        run: npm run test:api

  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
